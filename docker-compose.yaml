services:
  docked:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docked
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATA_DIR=/data
      - TZ=America/Chicago
      - NODE_ENV=development
      # Set DOCKED_URL if runners can't reach this server (e.g. localhost won't work for remote LXCs)
      - DOCKED_URL=http://192.168.20.159:3002
      # JWT_SECRET: optional. If unset the server generates a strong secret on
      # first boot and persists it to /data/jwt_secret (0600), so sessions
      # survive restarts without any key ever living in this file.
      # - JWT_SECRET=...
      # TRUSTED_PROXIES: CIDRs whose X-Forwarded-For we honor. Default is
      # loopback + private ranges, which covers a same-host/LAN reverse proxy.
      # - TRUSTED_PROXIES=127.0.0.1,192.168.1.0/24
      # GitHub PAT for API rate limit (60 -> 5,000 req/hr). Fine-grained token with public repo read access is sufficient.
    volumes:
      - ./data:/data
    networks:
      - docked-network

networks:
  docked-network:
    driver: bridge
