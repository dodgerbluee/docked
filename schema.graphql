# -----------------------------------------------------------------------------
# Long-Running Operations
# -----------------------------------------------------------------------------

# Operation is a pollable job handle. id is a correlation id: batch operations
# ("batch-<runID>", including container sync) are persisted in batch_runs and can
# be read back through query operation(id). A single-container upgrade id names
# that upgrade's lock owner (visible in the admin debug lock list) and is not
# pollable.
type Operation {
  id: ID!
  type: OperationType!
  status: OperationStatus!
  progress: Int
  message: String
  queuedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
  result: OperationResult
  errorCode: ErrorCode
}

union OperationResult = IntentExecution | BatchRun | BatchUpgradeResult | UpgradeResult

enum OperationType {
  PULL_CONTAINERS
  UPGRADE_CONTAINER
  BATCH_UPGRADE
  INTENT_EXECUTION
  BATCH_JOB
}

enum OperationStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

