# -----------------------------------------------------------------------------
# Query Root
# -----------------------------------------------------------------------------

type Query {
  # ── Health & Version ──────────────────────────────────────────────────────
  health: HealthCheck!
  version: AppVersion!
  latestRelease: GitHubRelease

  # ── Auth / User ───────────────────────────────────────────────────────────
  me: User!
  users: [User!]!                          # admin only
  user(id: ID!): User                      # admin only
  registrationCodeRequired: Boolean!
  registrationCodeStatus: RegistrationCodeStatus!
  userExists(username: String!): Boolean!

  # ── SSO / OAuth admin (instance admin only) ───────────────────────────────
  ssoProviders: [SSOProvider!]!
  ssoSettings: SSOSettings!

  # ── Containers ────────────────────────────────────────────────────────────
  containers(
    filter: ContainerFilterInput
    first: Int
    after: String
  ): ContainerConnection!

  # Grouped view (stacks + standalone) — mirrors the main dashboard
  containerGroup: ContainerGroup!

  # Single container by canonical ID (source/endpoint resolved server-side)
  container(id: ID!): Container

  # Developer-mode data viewer: cached container rows grouped by image, plus
  # the raw table records and their image-keyed correlation.
  containerData: ContainerDataResult!

  # ── Images ────────────────────────────────────────────────────────────────
  unusedImages: [DockerImage!]!

  # ── Runners (dockhand agents) ─────────────────────────────────────────────
  runners: [Runner!]!
  runner(id: ID!): Runner
  runnerEvents(runnerId: ID!, first: Int, offset: Int, eventType: String): RunnerEventConnection!
  runnerLogs(runnerId: ID!, lines: Int): RunnerLogsResult!

  # ── Tracked Apps ──────────────────────────────────────────────────────────
  trackedApps: [TrackedApp!]!
  trackedApp(id: ID!): TrackedApp

  # ── Intents ───────────────────────────────────────────────────────────────
  intents: [Intent!]!
  intent(id: ID!): Intent
  intentExecutions(
    intentId: ID
    first: Int
    after: String
  ): IntentExecutionConnection!
  intentExecution(id: ID!): IntentExecution

  # Preview which containers an intent would match (dry-run, no side effects)
  previewIntent(id: ID!): IntentPreview!

  # ── Batch System ──────────────────────────────────────────────────────────
  batchConfigs: [BatchConfig!]!
  batchLogLevel: LogLevel!
  batchRuns(
    jobType: BatchJobType
    first: Int
    after: String
  ): BatchRunConnection!
  batchRun(id: ID!): BatchRun

  # ── Upgrade History ───────────────────────────────────────────────────────
  upgradeHistory(
    filter: UpgradeHistoryFilterInput
    first: Int
    after: String
  ): UpgradeRecordConnection!
  upgradeHistoryStats: UpgradeHistoryStats!
  # Global tracked-app upgrade list (limit/offset paging, matching the old REST route).
  trackedAppUpgradeHistory(
    filter: TrackedAppHistoryFilterInput
    first: Int
    offset: Int
  ): [TrackedAppUpgradeRecord!]!
  trackedAppUpgradeHistoryStats: TrackedAppUpgradeHistoryStats!

  # ── Discord ───────────────────────────────────────────────────────────────
  discordWebhooks: [DiscordWebhook!]!
  discordWebhook(id: ID!): DiscordWebhook
  discordWebhookInfo(webhookUrl: String!): DiscordWebhookInfo

  # ── Repository Tokens ─────────────────────────────────────────────────────
  repositoryTokens: [RepositoryAccessToken!]!
  repositoryToken(provider: String!): RepositoryAccessToken

  # ── Settings ──────────────────────────────────────────────────────────────
  userPreferences: UserPreferences!
  # Per-user container blocklist. containers is null when unset (client
  # falls back to defaultPatterns).
  disallowedContainers: DisallowedContainersResult!
  # System-wide flag gating the debug endpoints surface.
  debugEndpointsEnabled: Boolean!

  # ── OAuth / SSO ───────────────────────────────────────────────────────────
  oauthProviders: [OAuthProvider!]!

  # ── Logs ──────────────────────────────────────────────────────────────────
  logs(lines: Int, since: Int, file: String, offset: Int): LogResult!

  # ── Operations (long-running task tracking) ───────────────────────────────
  operation(id: ID!): Operation

  # ── Summary ───────────────────────────────────────────────────────────────
  summaryStats: SummaryStats!
}

type HealthCheck {
  status: String!
}

type AppVersion {
  version: String!
  environment: String!
  isDevBuild: Boolean!
}

type GitHubRelease {
  tagName: String!
  publishedAt: DateTime!
  htmlUrl: String!
}

type LogResult {
  logs: String!
  totalLines: Int!
  returnedLines: Int!
  newLines: Int!
  # Byte size of the log file after the read (for offset-based incremental polling)
  fileSize: Int!
  # True when the file shrank below the requested offset (log rotation)
  rotated: Boolean!
}

# Developer-mode data viewer payload. The entry and record shapes mirror the
# legacy REST debug contract (image-grouped entries, raw table rows, and those
# rows correlated by image) and are intentionally untyped JSON.
type ContainerDataResult {
  success: Boolean!
  entries: [JSON!]!
  rawDatabaseRecords: JSON
  correlatedRecords: JSON
}

# -----------------------------------------------------------------------------
# Mutation Root
# -----------------------------------------------------------------------------

type Mutation {
  # ── Auth ──────────────────────────────────────────────────────────────────
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
  logout(refreshToken: String): SuccessResult!
  updatePassword(input: UpdatePasswordInput!): SuccessResult!
  updateUsername(input: UpdateUsernameInput!): UpdateUsernameResult!

  # ── Bootstrap (first-user registration code + instance-admin import) ─────
  generateRegistrationCode: BootstrapResult!
  verifyRegistrationCode(code: String!): BootstrapResult!
  generateInstanceAdminToken(username: String!): InstanceAdminTokenResult!
  regenerateInstanceAdminToken(username: String!): InstanceAdminTokenResult!
  verifyInstanceAdminToken(username: String!, token: String!): BootstrapResult!

  # Admin user management
  setUserPassword(userId: ID!, newPassword: String!): SuccessResult!
  setUserRole(userId: ID!, role: Role!, instanceAdmin: Boolean): SuccessResult!
  deleteUser(userId: ID!): SuccessResult!

  # ── Containers ────────────────────────────────────────────────────────────
  # Returns an Operation for tracking long-running pull
  pullContainers(runnerId: ID): Operation!
  upgradeContainer(input: UpgradeContainerInput!): Operation!
  batchUpgrade(input: BatchUpgradeInput!): Operation!
  clearContainerData: SuccessResult!

  # ── Images ────────────────────────────────────────────────────────────────
  deleteImages(images: [DeleteImageInput!]!): DeleteImagesResult!

  # ── Runners ───────────────────────────────────────────────────────────────
  createRunner(input: CreateRunnerInput!): Runner!
  updateRunner(id: ID!, input: UpdateRunnerInput!): Runner!
  deleteRunner(id: ID!): SuccessResult!
  runnerHealthCheck(runnerId: ID!): RunnerHealthResult!
  restartRunner(runnerId: ID!): SuccessResult!
  updateRunnerBinary(runnerId: ID!, version: String): SuccessResult!
  uninstallRunner(runnerId: ID!): SuccessResult!
  generateEnrollmentToken: EnrollmentTokenResult!

  # ── Tracked Apps ──────────────────────────────────────────────────────────
  createTrackedApp(input: CreateTrackedAppInput!): TrackedApp!
  updateTrackedApp(id: ID!, input: UpdateTrackedAppInput!): TrackedApp!
  deleteTrackedApp(id: ID!): SuccessResult!
  checkTrackedAppUpdates: TrackedAppCheckResult!
  checkTrackedAppUpdate(id: ID!): TrackedAppCheckResult!
  clearTrackedAppCache: SuccessResult!

  # ── Intents ───────────────────────────────────────────────────────────────
  createIntent(input: CreateIntentInput!): Intent!
  updateIntent(id: ID!, input: UpdateIntentInput!): Intent!
  deleteIntent(id: ID!): SuccessResult!
  triggerIntent(id: ID!, idempotencyKey: String): IntentExecution!
  # Evaluation-only run: records matches as dry_run rows, never upgrades.
  dryRunIntent(id: ID!): IntentExecution!

  # ── Batch System ──────────────────────────────────────────────────────────
  updateBatchConfig(input: UpdateBatchConfigInput!): SuccessResult!
  triggerBatchJob(jobType: BatchJobType, idempotencyKey: String): BatchRun!
  setBatchLogLevel(logLevel: LogLevel!): SuccessResult!
  createBatchRun(jobType: BatchJobType, isManual: Boolean): BatchRun!
  updateBatchRun(
    id: ID!
    status: BatchRunStatus!
    containersChecked: Int
    containersUpdated: Int
    errorMessage: String
    logs: String
  ): SuccessResult!

  # ── Discord ───────────────────────────────────────────────────────────────
  createDiscordWebhook(input: CreateDiscordWebhookInput!): DiscordWebhook!
  updateDiscordWebhook(id: ID!, input: UpdateDiscordWebhookInput!): DiscordWebhook!
  deleteDiscordWebhook(id: ID!): SuccessResult!
  testDiscordWebhook(id: ID!): SuccessResult!
  testDiscordWebhookUrl(webhookUrl: String!): SuccessResult!

  # ── Repository Tokens ─────────────────────────────────────────────────────
  saveRepositoryToken(input: CreateRepositoryTokenInput!): RepositoryAccessToken!
  deleteRepositoryToken(id: ID!): SuccessResult!
  associateImages(tokenId: ID!, input: AssociateImagesInput!): SuccessResult!

  # ── Registry Credentials ──────────────────────────────────────────────────
  updateRegistryCredentials(input: UpdateRegistryCredentialsInput!): SuccessResult!
  deleteRegistryCredentials(registry: Registry!): SuccessResult!
  validateRegistryCredentials(input: ValidateRegistryCredentialsInput!): ValidationResult!

  # ── Settings ──────────────────────────────────────────────────────────────
  updateUserPreferences(input: UpdateUserPreferencesInput!): SuccessResult!
  # Replaces the per-user blocklist; returns the sanitized stored list.
  setDisallowedContainers(containers: [String!]!): DisallowedContainersResult!
  # System-wide; instance admin only.
  setDebugEndpointsEnabled(enabled: Boolean!): SuccessResult!

  # ── SSO / OAuth admin (instance admin only) ───────────────────────────────
  createSSOProvider(input: CreateSSOProviderInput!): SuccessResult!
  updateSSOProvider(id: ID!, input: UpdateSSOProviderInput!): SuccessResult!
  deleteSSOProvider(id: ID!): SuccessResult!
  testSSOProvider(issuerUrl: String!): SSOProviderTestResult!
  setSSOSettings(allowLocalLogin: Boolean!): SuccessResult!

  # ── Avatars ───────────────────────────────────────────────────────────────
  uploadAvatar(file: Upload!): SuccessResult!
  deleteAvatar: SuccessResult!
}

# -----------------------------------------------------------------------------
# Mutation Result Types
# -----------------------------------------------------------------------------

type SuccessResult {
  success: Boolean!
  message: String
  errorCode: ErrorCode
}

# Returned by updateUsername: the renamed user plus freshly minted tokens,
# mirroring the REST contract which re-issues JWTs after a rename.
type UpdateUsernameResult {
  success: Boolean!
  message: String
  username: String
  token: String
  refreshToken: String
}

type ValidationResult {
  valid: Boolean!
  message: String
  errorCode: ErrorCode
}

type UpgradeResult {
  success: Boolean!
  message: String
  dockerContainerId: String!
  errorCode: ErrorCode
}

type BatchUpgradeResult {
  success: Boolean!
  upgraded: Int!
  failed: Int!
  results: [UpgradeResult!]!
}

# Per-image outcomes mirror the REST response: results = successes,
# errors = {id, error} rows.
type DeleteImagesResult {
  success: Boolean!
  deleted: Int!
  results: [DeleteImageResult!]!
  errors: [DeleteImageResult!]
}

type DeleteImageResult {
  id: String!
  success: Boolean
  error: String
}

type EnrollmentTokenResult {
  token: String!
  expiresAt: DateTime!
}

type TrackedAppCheckResult {
  success: Boolean!
  checked: Int
  updated: Int
  hasUpdate: Boolean
  currentVersion: String
  latestVersion: String
}

# -----------------------------------------------------------------------------
# Subscriptions (real-time updates via WebSocket)
# -----------------------------------------------------------------------------
# All subscriptions derive the user scope from the authenticated connection.
# No userId argument is accepted.

type Subscription {
  # Fires when container data is refreshed (pull) — scoped invalidation
  containersUpdated: ContainersUpdatedEvent!

  # Fires when a container upgrade progresses
  containerUpgradeProgress: UpgradeProgressEvent!

  # Fires when a batch job starts/progresses/completes
  batchJobProgress: BatchRun!

  # Fires when an intent execution starts/progresses/completes
  intentExecutionProgress: IntentExecution!

  # Fires when a runner connects/disconnects
  runnerStatusChanged: RunnerStatusEvent!

  # Fires for any long-running operation status change
  operationProgress: Operation!
}

type ContainersUpdatedEvent {
  sourceIds: [ID!]!
  containerCount: Int!
  # Optional: publishers may omit it; clients refetch stats on event.
  stats: SummaryStats
}

type UpgradeProgressEvent {
  operationId: ID!
  dockerContainerId: String!
  containerName: String!
  sourceType: SourceType!
  sourceName: String!
  phase: UpgradePhase!
  message: String
  progress: Int
}

type RunnerStatusEvent {
  runnerId: ID!
  runnerName: String!
  status: RunnerStatus!
  lastHeartbeat: DateTime
}
