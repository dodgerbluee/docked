  updatedAt: DateTime!
}

# -----------------------------------------------------------------------------
# Repository Access Tokens
# -----------------------------------------------------------------------------

type RepositoryAccessToken {
  id: ID!
  provider: String!
  maskedToken: String!
  createdAt: DateTime!
  updatedAt: DateTime!

  associatedImages: [AssociatedImage!]!
}

