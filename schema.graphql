# -----------------------------------------------------------------------------
# Intents (Declarative Auto-Upgrade Policies)
# -----------------------------------------------------------------------------
# Match semantics (this is the write contract; db.marshalJSONArr and the
# UpdateIntent resolver both follow it):
#   - omitted / null on write = leave the stored dimension untouched
#   - [] (empty array) on write = clear the dimension, i.e. make it inactive
#   - stored null = dimension inactive (contributes no filter)
#   - non-empty array = OR within field, AND across fields
#   - A row stored as "[]" predates this contract (Node-era data). The matcher
#     still reads it as "matches nothing" so such a row can never silently
#     widen into "matches everything".
#   - exclusions are applied after inclusions
#   - matchSources uses typed IDs: "runner:<id>" (legacy "portainer:<id>" entries are inert)
#   - scheduleCron uses the intent's scheduleTimezone (IANA), defaults to server TZ

type Intent {
  id: ID!
  name: String!
  description: String
  enabled: Boolean!

  # Match criteria (glob patterns)
  matchContainers: [String!]
  matchImages: [String!]
  matchSources: [String!]
  matchStacks: [String!]
  matchRegistries: [String!]

  # Exclusion criteria
  excludeContainers: [String!]
  excludeImages: [String!]
  excludeStacks: [String!]
  excludeRegistries: [String!]

  # Schedule
  scheduleType: IntentScheduleType!
  scheduleCron: String
  scheduleTimezone: String  # IANA timezone, e.g. "America/Chicago". Defaults to server TZ.

  # Execution config
  maxConcurrent: Int!
  dryRun: Boolean!
  sequentialDelaySec: Int!

  # State
  lastEvaluatedAt: DateTime
  lastExecution: IntentExecution
  createdAt: DateTime!
  updatedAt: DateTime!

  executions(first: Int, after: String): IntentExecutionConnection!
}

# Preview result returned by previewIntent query.
# currentMatches: containers matching the intent (regardless of update status);
# excludedContainers: matched inclusion but excluded, with exclusionReason;
# nextExecutionPreview: containers that would be upgraded (status "would_upgrade").
type IntentPreviewContainer {
  containerId: String!
  containerName: String!
  imageName: String
  stackName: String
  sourceInstanceId: ID
  runnerId: ID
  hasUpdate: Boolean!
  exclusionReason: String
  status: String
}

type IntentPreview {
  intentId: ID!
  currentMatches: [IntentPreviewContainer!]!
  excludedContainers: [IntentPreviewContainer!]!
  nextExecutionPreview: [IntentPreviewContainer!]!
}

type IntentExecution {
  id: ID!
  intentId: ID!
  intent: Intent
  status: IntentExecutionStatus!
  triggerType: IntentTriggerType!
  containersMatched: Int!
  containersUpgraded: Int!
  containersFailed: Int!
  containersSkipped: Int!
  errorMessage: String
  queuedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
  durationMs: Int
  performedBy: User

  containers(first: Int, after: String): IntentExecutionContainerConnection!
}

type IntentExecutionContainer {
  id: ID!
  executionId: ID!
  execution: IntentExecution
  dockerContainerId: String!
  containerName: String!
  imageName: String!
  sourceInstanceId: ID
  runnerId: ID
  runner: Runner
  status: ExecutionContainerStatus!
  oldImage: String
  newImage: String
  oldDigest: String
  newDigest: String
  errorMessage: String
  durationMs: Int
  createdAt: DateTime!
}

