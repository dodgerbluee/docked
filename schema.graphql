# -----------------------------------------------------------------------------
# Query Root
# -----------------------------------------------------------------------------

type Query {
  # ── Health & Version ──────────────────────────────────────────────────────
  health: HealthCheck!
  version: AppVersion!
  latestRelease: GitHubRelease

  # ── Auth / User ───────────────────────────────────────────────────────────
  me: User!
  users: [User!]!                          # admin only
  registrationCodeRequired: Boolean!
  userExists(username: String!): Boolean!

  # ── Containers ────────────────────────────────────────────────────────────
  containers(
    filter: ContainerFilterInput
    first: Int
    after: String
  ): ContainerConnection!

  # Grouped view (stacks + standalone) — mirrors the main dashboard
  containerGroup: ContainerGroup!

  # Single container by canonical ID (source/endpoint resolved server-side)
  container(id: ID!): Container

  # ── Images ────────────────────────────────────────────────────────────────
  unusedImages: [DockerImage!]!

  # ── Sources (Portainer instances) ─────────────────────────────────────────
  sourceInstances: [SourceInstance!]!
  sourceInstance(id: ID!): SourceInstance

  # ── Runners (dockhand agents) ─────────────────────────────────────────────
  runners: [Runner!]!
  runner(id: ID!): Runner

  # ── Tracked Apps ──────────────────────────────────────────────────────────
  trackedApps: [TrackedApp!]!
  trackedApp(id: ID!): TrackedApp

  # ── Intents ───────────────────────────────────────────────────────────────
  intents: [Intent!]!
  intent(id: ID!): Intent
  intentExecutions(
    intentId: ID
    first: Int
    after: String
  ): IntentExecutionConnection!

  # Preview which containers an intent would match (dry-run, no side effects)
  previewIntent(id: ID!): IntentPreview!

  # ── Batch System ──────────────────────────────────────────────────────────
  batchConfigs: [BatchConfig!]!
  batchRuns(
    jobType: BatchJobType
    first: Int
    after: String
  ): BatchRunConnection!
  batchRun(id: ID!): BatchRun

  # ── Upgrade History ───────────────────────────────────────────────────────
  upgradeHistory(
    filter: UpgradeHistoryFilterInput
    first: Int
    after: String
  ): UpgradeRecordConnection!

  # ── Discord ───────────────────────────────────────────────────────────────
  discordWebhooks: [DiscordWebhook!]!
  discordWebhook(id: ID!): DiscordWebhook

  # ── Repository Tokens ─────────────────────────────────────────────────────
  repositoryTokens: [RepositoryAccessToken!]!
  repositoryToken(provider: String!): RepositoryAccessToken

  # ── Settings ──────────────────────────────────────────────────────────────
  userPreferences: UserPreferences!

  # ── OAuth / SSO ───────────────────────────────────────────────────────────
  oauthProviders: [OAuthProvider!]!

  # ── Logs ──────────────────────────────────────────────────────────────────
  logs(lines: Int, since: Int, file: String): LogResult!

  # ── Operations (long-running task tracking) ───────────────────────────────
  operation(id: ID!): Operation

  # ── Summary ───────────────────────────────────────────────────────────────
  summaryStats: SummaryStats!
}

type HealthCheck {
  status: String!
}

type AppVersion {
  version: String!
  environment: String!
  isDevBuild: Boolean!
}

type GitHubRelease {
  tagName: String!
  publishedAt: DateTime!
  htmlUrl: String!
}

type LogResult {
  logs: String!
  totalLines: Int!
  returnedLines: Int!
  newLines: Int!
}

# -----------------------------------------------------------------------------
# Mutation Root
# -----------------------------------------------------------------------------

type Mutation {
  # ── Auth ──────────────────────────────────────────────────────────────────
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
  logout: SuccessResult!
  updatePassword(input: UpdatePasswordInput!): SuccessResult!
  updateUsername(input: UpdateUsernameInput!): SuccessResult!

  # Admin user management
  setUserPassword(userId: ID!, newPassword: String!): SuccessResult!
  setUserRole(userId: ID!, role: Role!): SuccessResult!

  # ── Containers ────────────────────────────────────────────────────────────
  # Returns an Operation for tracking long-running pull
  pullContainers(sourceInstanceId: ID, runnerId: ID): Operation!
  upgradeContainer(input: UpgradeContainerInput!): Operation!
  batchUpgrade(input: BatchUpgradeInput!): Operation!
  clearContainerData: SuccessResult!

  # ── Images ────────────────────────────────────────────────────────────────
  deleteImages(images: [DeleteImageInput!]!): DeleteImagesResult!

  # ── Sources ───────────────────────────────────────────────────────────────
  createSourceInstance(input: CreateSourceInstanceInput!): SourceInstance!
  updateSourceInstance(id: ID!, input: UpdateSourceInstanceInput!): SourceInstance!
  deleteSourceInstance(id: ID!): SuccessResult!
  reorderSourceInstances(instances: [ReorderSourceInput!]!): SuccessResult!
  validateSourceCredentials(input: ValidateSourceCredentialsInput!): ValidationResult!

  # ── Runners ───────────────────────────────────────────────────────────────
  createRunner(input: CreateRunnerInput!): Runner!
  updateRunner(id: ID!, input: UpdateRunnerInput!): Runner!
  deleteRunner(id: ID!): SuccessResult!
  generateEnrollmentToken: EnrollmentTokenResult!

  # ── Tracked Apps ──────────────────────────────────────────────────────────
  createTrackedApp(input: CreateTrackedAppInput!): TrackedApp!
  updateTrackedApp(id: ID!, input: UpdateTrackedAppInput!): TrackedApp!
  deleteTrackedApp(id: ID!): SuccessResult!
  checkTrackedAppUpdates: TrackedAppCheckResult!
  checkTrackedAppUpdate(id: ID!): TrackedAppCheckResult!
  clearTrackedAppCache: SuccessResult!

  # ── Intents ───────────────────────────────────────────────────────────────
  createIntent(input: CreateIntentInput!): Intent!
  updateIntent(id: ID!, input: UpdateIntentInput!): Intent!
  deleteIntent(id: ID!): SuccessResult!
  triggerIntent(id: ID!, idempotencyKey: String): IntentExecution!

  # ── Batch System ──────────────────────────────────────────────────────────
  updateBatchConfig(input: UpdateBatchConfigInput!): SuccessResult!
  triggerBatchJob(jobType: BatchJobType, idempotencyKey: String): BatchRun!
  setBatchLogLevel(logLevel: LogLevel!): SuccessResult!

  # ── Discord ───────────────────────────────────────────────────────────────
  createDiscordWebhook(input: CreateDiscordWebhookInput!): DiscordWebhook!
  updateDiscordWebhook(id: ID!, input: UpdateDiscordWebhookInput!): DiscordWebhook!
  deleteDiscordWebhook(id: ID!): SuccessResult!
  testDiscordWebhook(id: ID!): SuccessResult!
  testDiscordWebhookUrl(webhookUrl: String!): SuccessResult!

  # ── Repository Tokens ─────────────────────────────────────────────────────
  saveRepositoryToken(input: CreateRepositoryTokenInput!): RepositoryAccessToken!
  deleteRepositoryToken(id: ID!): SuccessResult!
  associateImages(tokenId: ID!, input: AssociateImagesInput!): SuccessResult!

  # ── Registry Credentials ──────────────────────────────────────────────────
  updateRegistryCredentials(input: UpdateRegistryCredentialsInput!): SuccessResult!
  deleteRegistryCredentials(registry: Registry!): SuccessResult!
  validateRegistryCredentials(input: ValidateRegistryCredentialsInput!): ValidationResult!

  # ── Settings ──────────────────────────────────────────────────────────────
  updateUserPreferences(input: UpdateUserPreferencesInput!): SuccessResult!

  # ── Avatars ───────────────────────────────────────────────────────────────
  uploadAvatar(file: Upload!): SuccessResult!
  deleteAvatar: SuccessResult!
}

# -----------------------------------------------------------------------------
# Mutation Result Types
# -----------------------------------------------------------------------------

type SuccessResult {
  success: Boolean!
  message: String
  errorCode: ErrorCode
}

type ValidationResult {
  valid: Boolean!
  message: String
  errorCode: ErrorCode
}

type UpgradeResult {
  success: Boolean!
  message: String
  dockerContainerId: String!
  errorCode: ErrorCode
}

type BatchUpgradeResult {
  success: Boolean!
  upgraded: Int!
  failed: Int!
  results: [UpgradeResult!]!
}

type DeleteImagesResult {
  success: Boolean!
  deleted: Int!
  failed: Int!
  results: [DeleteImageResult!]!
}

type DeleteImageResult {
  imageId: String!
  success: Boolean!
  errorCode: ErrorCode
}

type EnrollmentTokenResult {
  token: String!
  expiresAt: DateTime!
}

type TrackedAppCheckResult {
  success: Boolean!
  checked: Int
  updated: Int
  hasUpdate: Boolean
  currentVersion: String
  latestVersion: String
}

# -----------------------------------------------------------------------------
# Subscriptions (real-time updates via WebSocket)
# -----------------------------------------------------------------------------
# All subscriptions derive the user scope from the authenticated connection.
# No userId argument is accepted.

type Subscription {
  # Fires when container data is refreshed (pull) — scoped invalidation
  containersUpdated: ContainersUpdatedEvent!

  # Fires when a container upgrade progresses
  containerUpgradeProgress: UpgradeProgressEvent!

  # Fires when a batch job starts/progresses/completes
  batchJobProgress: BatchRun!

  # Fires when an intent execution starts/progresses/completes
  intentExecutionProgress: IntentExecution!

  # Fires when a runner connects/disconnects
  runnerStatusChanged: RunnerStatusEvent!

  # Fires for any long-running operation status change
  operationProgress: Operation!
}

type ContainersUpdatedEvent {
  sourceIds: [ID!]!
  containerCount: Int!
  stats: SummaryStats!
}

type UpgradeProgressEvent {
  operationId: ID!
  dockerContainerId: String!
  containerName: String!
  sourceType: SourceType!
  sourceName: String!
  phase: UpgradePhase!
  message: String
  progress: Int
}

type RunnerStatusEvent {
  runnerId: ID!
  runnerName: String!
  status: RunnerStatus!
  lastHeartbeat: DateTime
}
