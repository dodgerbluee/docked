  name: String!
  description: String
}

# -----------------------------------------------------------------------------
# OAuth / SSO
# -----------------------------------------------------------------------------

type OAuthProvider {
  id: ID!
  name: String!
  type: OAuthProviderType!
  enabled: Boolean!
  issuerUrl: String
  clientId: String
  scopes: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# -----------------------------------------------------------------------------
# Settings (allowlisted — no generic key/value exposure)
# -----------------------------------------------------------------------------

type UserPreferences {
  colorScheme: String!
  disablePortainerPage: Boolean!
  disableTrackedAppsPage: Boolean!
  refreshingTogglesEnabled: Boolean!
}

# -----------------------------------------------------------------------------
# Docker Images
# -----------------------------------------------------------------------------

type DockerImage {
  id: String!
  repoTags: [String!]!
  sizeBytes: BigInt!
  created: DateTime!
  sourceUrl: String!
  endpointId: String!
}

# -----------------------------------------------------------------------------
# Summary / Stats
# -----------------------------------------------------------------------------

type SummaryStats {
  totalContainers: Int!
  containersWithUpdates: Int!
  totalSources: Int!
  totalRunners: Int!
  totalTrackedApps: Int!
  trackedAppsWithUpdates: Int!
  unusedImagesCount: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ContainerConnection {
  items: [Container!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UpgradeRecordConnection {
  items: [UpgradeRecord!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TrackedAppUpgradeRecordConnection {
  items: [TrackedAppUpgradeRecord!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type IntentExecutionConnection {
  items: [IntentExecution!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type IntentExecutionContainerConnection {
  items: [IntentExecutionContainer!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type BatchRunConnection {
  items: [BatchRun!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# -----------------------------------------------------------------------------
# Container Grouping (mirrors the REST grouped response)
# -----------------------------------------------------------------------------

type ContainerGroup {
  stacks: [StackGroup!]!
  standalone(first: Int, after: String): ContainerConnection!
  sources: [SourceInstance!]!
  runners: [Runner!]!
  unusedImagesCount: Int!
  stats: SummaryStats!
}

type StackGroup {
  id: ID!
  name: String!
  source: ContainerSource!
  endpointId: String
  containers(first: Int, after: String): ContainerConnection!
}

# -----------------------------------------------------------------------------
# Long-Running Operations
# -----------------------------------------------------------------------------

type Operation {
  id: ID!
  type: OperationType!
  status: OperationStatus!
  progress: Int
  message: String
  queuedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
  result: OperationResult
  errorCode: ErrorCode
}

union OperationResult = IntentExecution | BatchRun | BatchUpgradeResult | UpgradeResult

enum OperationType {
  PULL_CONTAINERS
  UPGRADE_CONTAINER
  BATCH_UPGRADE
  INTENT_EXECUTION
  BATCH_JOB
}

enum OperationStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

