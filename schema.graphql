# =============================================================================
# Docked — GraphQL Schema (v2)
# =============================================================================
# A unified GraphQL API layer over the existing REST backend.
# Mirrors the SQLite domain model with a richer, composable query surface.
# =============================================================================

# -----------------------------------------------------------------------------
# Scalars
# -----------------------------------------------------------------------------

scalar DateTime
scalar JSON
scalar BigInt   # 64-bit integer for byte sizes etc.
scalar Upload   # graphql-upload multipart file


# -----------------------------------------------------------------------------
# Enums
# -----------------------------------------------------------------------------

enum Role {
  ADMINISTRATOR
  MEMBER
}

enum AuthType {
  PASSWORD
  APIKEY
}

enum SourceType {
  PORTAINER
  RUNNER
}

enum ContainerState {
  RUNNING
  EXITED
  RESTARTING
  CREATED
  PAUSED
  DEAD
  UNKNOWN
}

enum Registry {
  DOCKER_HUB
  GHCR
  GITLAB
  GCR
  QUAY
  OTHER
}

enum BatchJobType {
  DOCKER_HUB_PULL
  UPGRADE_CONTAINERS
  TRACKED_APPS_CHECK
  APP_VERSION_SCAN
}

enum BatchRunStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

enum IntentScheduleType {
  IMMEDIATE
  SCHEDULED
}

enum IntentExecutionStatus {
  PENDING
  RUNNING
  COMPLETED
  PARTIAL
  FAILED
}

enum IntentTriggerType {
  MANUAL
  SCAN_DETECTED
  SCHEDULED_WINDOW
}

enum UpgradeStatus {
  SUCCESS
  FAILED
  SKIPPED
}

# Per-container lifecycle within an intent execution (supports in-flight states)
enum ExecutionContainerStatus {
  PENDING
  RUNNING
  UPGRADED
  FAILED
  SKIPPED
  DRY_RUN
}

enum TrackedAppSourceType {
  DOCKER
  GITHUB
  GITLAB
}

enum OAuthProviderType {
  AUTHENTIK
  GENERIC_OIDC
}

enum LogLevel {
  ERROR
  WARN
  INFO
  DEBUG
}

enum UpgradePhase {
  PULLING
  STOPPING
  RECREATING
  STARTING
  RESTARTING_DEPENDENTS
  COMPLETED
  FAILED
}

enum RunnerStatus {
  ONLINE
  OFFLINE
  DEGRADED
}

enum ErrorCode {
  UNAUTHENTICATED
  FORBIDDEN
  NOT_FOUND
  VALIDATION_ERROR
  CONFLICT
  RATE_LIMITED
  INTERNAL_ERROR
  REGISTRY_UNAVAILABLE
  DOCKER_ERROR
}

# -----------------------------------------------------------------------------
# Interfaces
# -----------------------------------------------------------------------------

# Unified interface for anything that hosts Docker containers
interface ContainerSource {
  id: ID!
  name: String!
  type: SourceType!
  containers(first: Int, after: String): ContainerConnection!
}

# -----------------------------------------------------------------------------
# Core Types
# -----------------------------------------------------------------------------

type User {
  id: ID!
  username: String!
  role: Role!
  passwordChanged: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  avatarUrl: String

  # Relations
  containers(first: Int, after: String): ContainerConnection!
  trackedApps: [TrackedApp!]!
  intents: [Intent!]!
  discordWebhooks: [DiscordWebhook!]!
  repositoryTokens: [RepositoryAccessToken!]!
  preferences: UserPreferences!

  # Stats
  containerCount: Int!
  sourceInstanceCount: Int!
  trackedAppCount: Int!
}

# Auth payload — no success flag; errors are thrown as GraphQL errors
type AuthPayload {
  token: String!
  refreshToken: String!
  user: User!
}

type SourceInstance implements ContainerSource {
  id: ID!
  name: String!
  url: String!
  type: SourceType!
  authType: AuthType!
  ipAddress: String
  displayOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Secrets are never returned — only presence
  hasApiKey: Boolean!
  hasPassword: Boolean!

  # Relations
  containers(first: Int, after: String): ContainerConnection!
  upgradeHistory(first: Int, after: String): UpgradeRecordConnection!
}

type Runner implements ContainerSource {
  id: ID!
  name: String!
  url: String!
  type: SourceType!
  enabled: Boolean!
  version: String
  dockerEnabled: Boolean!
  lastHeartbeat: DateTime
  healthStatus: String
  createdAt: DateTime!
  updatedAt: DateTime!

  hasApiKey: Boolean!

  # Relations
  containers(first: Int, after: String): ContainerConnection!
  upgradeHistory(first: Int, after: String): UpgradeRecordConnection!
  apps: [RunnerApp!]!
}

type Container {
  id: ID!
  dockerContainerId: String!
  name: String!
  imageName: String!
  imageRepo: String!
  status: String
  state: ContainerState!
  stackName: String
  endpointId: String
  currentDigest: String
  imageCreatedDate: DateTime
  usesNetworkMode: Boolean!
  providesNetwork: Boolean!
  lastSeen: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Source — exactly one, enforced via interface
  source: ContainerSource!

  # Image update info (resolved from deployed_images / registry_image_versions)
  imageInfo: ImageVersionInfo

  # Relations
  upgradeHistory(first: Int, after: String): UpgradeRecordConnection!
}

type ImageVersionInfo {
  registry: Registry!
  namespace: String
  repository: String!
  currentTag: String
  currentVersion: String
  currentDigest: String
  latestTag: String
  latestVersion: String
  latestDigest: String
  hasUpdate: Boolean!
  latestPublishDate: DateTime
  currentVersionPublishDate: DateTime
  lastChecked: DateTime!
}

type UpgradeRecord {
  id: ID!
  dockerContainerId: String!
  containerName: String!
  endpointId: String
  source: ContainerSource
  sourceUrl: String

  oldImage: String!
  newImage: String!
  oldDigest: String
  newDigest: String
  oldVersion: String
  newVersion: String

  imageRepo: String
  registry: String
  namespace: String
  repository: String

  status: UpgradeStatus!
  errorMessage: String
  upgradeDurationMs: Int
  intentId: ID
  intent: Intent
  performedBy: User
  createdAt: DateTime!
}

type TrackedApp {
  id: ID!
  name: String!
  imageName: String
  githubRepo: String
  gitlabRepo: String
  sourceType: TrackedAppSourceType!
  currentVersion: String
  currentDigest: String
  latestVersion: String
  latestDigest: String
  hasUpdate: Boolean!
  currentVersionPublishDate: DateTime
  latestVersionPublishDate: DateTime
  lastChecked: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!

  upgradeHistory(first: Int, after: String): TrackedAppUpgradeRecordConnection!
}

type TrackedAppUpgradeRecord {
  id: ID!
  trackedAppId: ID!
  oldVersion: String
  newVersion: String
  oldDigest: String
  newDigest: String
  status: UpgradeStatus!
  performedBy: User
  createdAt: DateTime!
}

# -----------------------------------------------------------------------------
# Intents (Declarative Auto-Upgrade Policies)
# -----------------------------------------------------------------------------
# Match semantics:
#   - null/omitted = no filter (matches all)
#   - [] (empty array) = matches nothing
#   - non-empty array = OR within field, AND across fields
#   - exclusions are applied after inclusions
#   - matchSources uses typed IDs: "portainer:<id>", "runner:<id>"
#   - scheduleCron uses the intent's scheduleTimezone (IANA), defaults to server TZ

type Intent {
  id: ID!
  name: String!
  description: String
  enabled: Boolean!

  # Match criteria (glob patterns)
  matchContainers: [String!]
  matchImages: [String!]
  matchSources: [String!]
  matchStacks: [String!]
  matchRegistries: [String!]

  # Exclusion criteria
  excludeContainers: [String!]
  excludeImages: [String!]
  excludeStacks: [String!]
  excludeRegistries: [String!]

  # Schedule
  scheduleType: IntentScheduleType!
  scheduleCron: String
  scheduleTimezone: String  # IANA timezone, e.g. "America/Chicago". Defaults to server TZ.

  # Execution config
  maxConcurrent: Int!
  dryRun: Boolean!
  sequentialDelaySec: Int!

  # State
  lastEvaluatedAt: DateTime
  lastExecution: IntentExecution
  createdAt: DateTime!
  updatedAt: DateTime!

  executions(first: Int, after: String): IntentExecutionConnection!
}

# Preview result returned by previewIntent query
type IntentPreview {
  intentId: ID!
  matchedContainers(first: Int, after: String): ContainerConnection!
  matchedCount: Int!
  excludedCount: Int!
}

type IntentExecution {
  id: ID!
  intentId: ID!
  intent: Intent
  status: IntentExecutionStatus!
  triggerType: IntentTriggerType!
  containersMatched: Int!
  containersUpgraded: Int!
  containersFailed: Int!
  containersSkipped: Int!
  errorMessage: String
  queuedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
  durationMs: Int
  performedBy: User

  containers(first: Int, after: String): IntentExecutionContainerConnection!
}

type IntentExecutionContainer {
  id: ID!
  executionId: ID!
  execution: IntentExecution
  dockerContainerId: String!
  containerName: String!
  imageName: String!
  sourceInstanceId: ID
  sourceInstance: SourceInstance
  runnerId: ID
  runner: Runner
  status: ExecutionContainerStatus!
  oldImage: String
  newImage: String
  oldDigest: String
  newDigest: String
  errorMessage: String
  durationMs: Int
  createdAt: DateTime!
}

# -----------------------------------------------------------------------------
# Batch System
# -----------------------------------------------------------------------------

type BatchConfig {
  id: ID!
  jobType: BatchJobType!
  enabled: Boolean!
  intervalMinutes: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type BatchRun {
  id: ID!
  status: BatchRunStatus!
