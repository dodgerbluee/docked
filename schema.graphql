  associated: Boolean!
}

# -----------------------------------------------------------------------------
# Runner Apps (dockhand agent operations)
# -----------------------------------------------------------------------------

type RunnerApp {
  name: String!
  description: String
  currentVersion: String
  versionCommand: String
  versionSource: String
