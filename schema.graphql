# =============================================================================
# Docked — GraphQL Schema (v2)
# =============================================================================
# A unified GraphQL API layer over the existing REST backend.
# Mirrors the SQLite domain model with a richer, composable query surface.
# =============================================================================

# -----------------------------------------------------------------------------
# Scalars
# -----------------------------------------------------------------------------

scalar DateTime
scalar JSON
scalar BigInt   # 64-bit integer for byte sizes etc.
scalar Upload   # graphql-upload multipart file


# -----------------------------------------------------------------------------
# Enums
# -----------------------------------------------------------------------------

enum Role {
  ADMINISTRATOR
  MEMBER
}

enum AuthType {
  PASSWORD
  APIKEY
}

enum SourceType {
  RUNNER
}

enum ContainerState {
  RUNNING
  EXITED
  RESTARTING
  CREATED
  PAUSED
  DEAD
  UNKNOWN
}

enum Registry {
  DOCKER_HUB
  GHCR
  GITLAB
  GCR
  QUAY
  OTHER
}

enum BatchJobType {
  DOCKER_HUB_PULL
  UPGRADE_CONTAINERS
  TRACKED_APPS_CHECK
  APP_VERSION_SCAN
}

enum BatchRunStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

enum IntentScheduleType {
  IMMEDIATE
  SCHEDULED
}

enum IntentExecutionStatus {
  PENDING
  RUNNING
  COMPLETED
  PARTIAL
  FAILED
}

enum IntentTriggerType {
  MANUAL
  SCAN_DETECTED
  SCHEDULED_WINDOW
}

enum UpgradeStatus {
  SUCCESS
  FAILED
  SKIPPED
}

# Per-container lifecycle within an intent execution (supports in-flight states)
enum ExecutionContainerStatus {
  PENDING
  RUNNING
  UPGRADED
  FAILED
  SKIPPED
  DRY_RUN
}

enum TrackedAppSourceType {
  DOCKER
  GITHUB
  GITLAB
}

enum OAuthProviderType {
  AUTHENTIK
  GENERIC_OIDC
}

enum LogLevel {
  ERROR
  WARN
  INFO
  DEBUG
}

enum UpgradePhase {
  PULLING
  STOPPING
  RECREATING
  STARTING
  RESTARTING_DEPENDENTS
  COMPLETED
  FAILED
}

enum RunnerStatus {
  ONLINE
  OFFLINE
  DEGRADED
}

enum ErrorCode {
  UNAUTHENTICATED
  FORBIDDEN
  NOT_FOUND
  VALIDATION_ERROR
  CONFLICT
  RATE_LIMITED
  INTERNAL_ERROR
  REGISTRY_UNAVAILABLE
  DOCKER_ERROR
