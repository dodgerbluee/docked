  queuedAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
  durationMs: Int
  containersChecked: Int!
  containersUpdated: Int!
  errorMessage: String
  logs: String
  isManual: Boolean!
  performedBy: User
}

# -----------------------------------------------------------------------------
# Discord Notifications
# -----------------------------------------------------------------------------

type DiscordWebhook {
  id: ID!
  maskedUrl: String!
  serverName: String
  channelName: String
  enabled: Boolean!
  avatarUrl: String
  guildId: String
  channelId: String
