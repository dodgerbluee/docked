schema:
  - ../schema.graphql

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - "github.com/dockedapp/backend/graph/model"

models:
  DateTime:
    model: github.com/dockedapp/backend/graph/model.DateTime
  BigInt:
    model: github.com/dockedapp/backend/graph/model.BigInt
  JSON:
    model: github.com/dockedapp/backend/graph/model.JSON
  Upload:
    model: github.com/dockedapp/backend/graph/model.Upload
  # Relation fields are loaded lazily via dedicated field resolvers rather than
  # bound to (nil) model struct fields.
  StackGroup:
    fields:
      containers:
        resolver: true
      source:
        resolver: true
  ContainerGroup:
    fields:
      standalone:
        resolver: true
  User:
    fields:
      containers:
        resolver: true
      trackedApps:
        resolver: true
      intents:
        resolver: true
      discordWebhooks:
        resolver: true
      repositoryTokens:
        resolver: true
      preferences:
        resolver: true
      containerCount:
        resolver: true
      sourceInstanceCount:
        resolver: true
      trackedAppCount:
        resolver: true
  SourceInstance:
    fields:
      containers:
        resolver: true
      upgradeHistory:
        resolver: true
  Runner:
    fields:
      containers:
        resolver: true
      upgradeHistory:
        resolver: true
      apps:
        resolver: true
  Container:
    fields:
      upgradeHistory:
        resolver: true
      # The parent query pre-seeds source with only the host's id so the
      # resolver can load the whole runner: a partial Runner projected
      # straight from the container row would report enabled=false and
      # zero timestamps for every container in the list.
      source:
        resolver: true
  UpgradeRecord:
    fields:
      source:
        resolver: true
      intent:
        resolver: true
  IntentExecutionContainer:
    fields:
      runner:
        resolver: true
  TrackedApp:
    fields:
      upgradeHistory:
        resolver: true
  IntentExecution:
    fields:
      containers:
        resolver: true
      intent:
        resolver: true
  Intent:
    fields:
      executions:
        resolver: true
      lastExecution:
        resolver: true
  RepositoryAccessToken:
    fields:
      associatedImages:
        resolver: true
