schema:
  - ../schema.graphql

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - "github.com/dockedapp/backend/graph/model"

models:
  DateTime:
    model: github.com/dockedapp/backend/graph/model.DateTime
  BigInt:
    model: github.com/dockedapp/backend/graph/model.BigInt
  JSON:
    model: github.com/dockedapp/backend/graph/model.JSON
  Upload:
    model: github.com/dockedapp/backend/graph/model.Upload
