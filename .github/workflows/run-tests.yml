name: Run Tests (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: true
        type: string
      run-coverage:
        description: "Run tests with coverage"
        required: false
        type: boolean
        default: false
      upload-coverage:
        description: "Upload coverage to Codecov"
        required: false
        type: boolean
        default: false
    outputs:
      client-tests-passed:
        description: "Whether client tests passed"
        value: ${{ jobs.test.outputs.client-tests-passed }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      client-tests-passed: ${{ steps.client-tests.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          npm ci
          cd client && npm ci

      - name: Run client tests
        id: client-tests
        run: |
          cd client
          if [ "${{ inputs.run-coverage }}" = "true" ]; then
            npm test -- --coverage
          else
            npm test
          fi
          echo "passed=true" >> $GITHUB_OUTPUT
        continue-on-error: false

      - name: Run Go backend tests
        run: |
          cd backend
          go vet ./...
          go test ./...
        continue-on-error: false

      - name: Upload test coverage
        if: inputs.upload-coverage == true
        uses: codecov/codecov-action@v5
        with:
          files: ./client/coverage/coverage-final.json
          flags: client
          name: test-coverage
          fail_ci_if_error: false
